<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP4 Video Player</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .video-container {
            width: 100%;
            max-width: 800px;
            margin: 30px auto;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            background: black;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h2>My Video Player</h2>

    <div class="video-container">
        <video controls playsinline preload="metadata">
            <source
                src="https://mp4-cdn77.xvideos-cdn.com/ca37846f-f761-4168-8cfc-304ea07d5bcd/6/mp4_sd.mp4?secure=qdranQxyIdzXBGkTQlfHGA==,1794468779"
                type="video/mp4">
            আপনার ব্রাউজার ভিডিওটি চালাতে পারছে না।
        </video>
    </div>

</body>
</html>
